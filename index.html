<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Study Command Center v7.1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="bootStatus" class="boot">
    <b>Booting Study Command Center v7.1...</b>
    <div id="bootLines">HTML loaded. Waiting for JavaScript...</div>
  </div>

  <div id="appShell" class="hidden">
    <header class="topbar">
      <div>
        <h1>Study Command Center v7.1</h1>
        <p id="topStatus">Starting diagnostics...</p>
      </div>
      <div class="top-actions">
        <button id="connectBtn">Connect</button>
        <button id="refreshBtn">Refresh</button>
        <button id="runDiagnosticsBtn">Diagnostics</button>
        <button id="modeBtn">Advanced Mode</button>
      </div>
    </header>

    <section class="diag-strip">
      <span id="workerPill">Worker: checking</span>
      <span id="wsPill">WebSocket: disconnected</span>
      <span id="devicePill">Devices: 0</span>
      <span id="livePill">Live: 0</span>
      <span id="warningPill">Warnings: 0</span>
      <span id="errorPill">Errors: 0</span>
    </section>

    <nav id="tabNav" class="tabs">
      <button data-tab="home" class="active">Home</button>
      <button data-tab="diagnostics">Diagnostics</button>
      <button data-tab="devices">Devices</button>
      <button data-tab="live">Live</button>
      <button data-tab="windows">Windows</button>
      <button data-tab="browser">Browser</button>
      <button data-tab="planning">Planning</button>
      <button data-tab="policies">Policies</button>
      <button data-tab="plans">Plans</button>
      <button data-tab="groups">Groups</button>
      <button data-tab="history">Planning History</button>
      <button data-tab="sessions">Sessions</button>
      <button data-tab="health">Health</button>
      <button data-tab="install">Install</button>
      <button data-tab="configgen">Config Generator</button>
      <button data-tab="debugger">Debugger</button>
      <button data-tab="logs">Logs</button>
      <button data-tab="advanced">Advanced</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <main id="viewRoot"></main>
  </div>

  <template id="diagnosticsTemplate">
    <section class="card">
      <div class="row">
        <div>
          <h2>Diagnostics</h2>
          <p>Step-by-step connection, Worker, WebSocket, device, live, browser, and planning checks.</p>
        </div>
        <div class="controls">
          <button id="diagRunFull">Run Full Diagnostics</button>
          <button id="diagWorkerOnly">Worker Only</button>
          <button id="diagWsOnly">WebSocket Only</button>
          <button id="diagExport">Export Report</button>
        </div>
      </div>
      <div id="diagList" class="diag-list"></div>
    </section>
  </template>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
